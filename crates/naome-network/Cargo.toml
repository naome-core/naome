[package]
name = "naome-network"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Authenticated replication of explicitly released REP inventories among configured peers"
publish = false

[[bin]]
name = "naome"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libp2p = { version = "=0.57.1", default-features = false, features = ["ed25519", "gossipsub", "macros", "noise", "request-response", "tcp", "tokio", "yamux"] }
naome-protocol = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time", "sync", "net", "io-util"] }

[dev-dependencies]
hex = "0.4"
