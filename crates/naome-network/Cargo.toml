[package]
name = "naome-network"
version.workspace = true
edition.workspace = true
description = "Authenticated proof transport and bounded peer-address storage for NAOME."
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.91"
getrandom = "0.3.4"
libp2p = { version = "0.56.0", default-features = false, features = [
    "ed25519",
    "macros",
    "noise",
    "request-response",
    "tcp",
    "tokio",
    "yamux",
] }
naome = { path = "../.." }
naome-ledger = { path = "../naome-ledger" }
naome-proof = { path = "../naome-proof" }
naome-storage = { path = "../naome-storage" }
sha2.workspace = true
tokio = { version = "1", default-features = false, features = ["macros", "time"] }

[dev-dependencies]
naome-foundation = { path = "../naome-foundation" }
tokio = { version = "1", default-features = false, features = [
    "rt",
    "test-util",
] }

[lints]
workspace = true
