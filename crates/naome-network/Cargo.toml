[package]
name = "naome-network"
version.workspace = true
edition.workspace = true
description = "Bounded authenticated canonical state transport over genesis peers for NAOME."
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.91"
libp2p = { version = "0.56.0", default-features = false, features = [
    "ed25519",
    "macros",
    "noise",
    "request-response",
    "tcp",
    "tokio",
    "yamux",
] }
naome-protocol = { path = "../naome-protocol" }
naome-ledger = { path = "../naome-ledger" }
ed25519-dalek.workspace = true
sha2.workspace = true
tokio = { version = "1", default-features = false, features = ["macros", "time"] }

[dev-dependencies]
naome-proof = { path = "../naome-proof" }
ed25519-dalek.workspace = true
tokio = { version = "1", default-features = false, features = [
    "rt",
    "test-util",
] }

[lints]
workspace = true
