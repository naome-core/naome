[package]
name = "naome-network"
version = "0.1.0"
edition = "2024"
description = "Authenticated bounded proof transport for static NAOME peers."
license = "MIT"
repository = "https://github.com/naome-core/naome"
publish = false

[dependencies]
async-trait = "0.1.91"
libp2p = { version = "0.56.0", default-features = false, features = [
    "ed25519",
    "macros",
    "noise",
    "request-response",
    "tcp",
    "tokio",
    "yamux",
] }
naome = { path = "../.." }
naome-ledger = { path = "../naome-ledger" }
naome-proof = { path = "../naome-proof" }
naome-storage = { path = "../naome-storage" }
tokio = { version = "1", default-features = false, features = ["time"] }

[dev-dependencies]
naome-foundation = { path = "../naome-foundation" }
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt",
    "time",
] }

[lints]
workspace = true
