[package]
name = "naome-runtime"
version.workspace = true
edition.workspace = true
description = "Bounded caller-configured fixed-validator event-loop integration for NAOME."
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ed25519-dalek = { workspace = true, features = ["zeroize"] }
naome-chain = { path = "../naome-chain" }
naome-consensus = { path = "../naome-consensus" }
naome-network = { path = "../naome-network" }
naome-node = { path = "../naome-node" }
naome-protocol = { path = "../naome-protocol" }
naome-proof = { path = "../naome-proof" }
naome-ledger = { path = "../naome-ledger" }
naome-storage = { path = "../naome-storage" }
sha2.workspace = true
zeroize = "1.9"
getrandom = "0.3"
tokio = { version = "1", default-features = false, features = ["macros", "time"] }

[dev-dependencies]
naome-checker = { path = "../naome-checker" }
naome-foundation = { path = "../naome-foundation" }
tokio = { version = "1", default-features = false, features = ["rt", "test-util"] }

[lints]
workspace = true
