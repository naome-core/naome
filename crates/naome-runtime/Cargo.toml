[package]
name = "naome-runtime"
version.workspace = true
edition.workspace = true
description = "Bounded caller-configured fixed-validator event-loop integration for NAOME."
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
naome-consensus = { path = "../naome-consensus" }
naome-network = { path = "../naome-network" }
naome-node = { path = "../naome-node" }
naome-storage = { path = "../naome-storage" }
tokio = { version = "1", default-features = false, features = ["macros", "time"] }

[dev-dependencies]
ed25519-dalek.workspace = true
naome-chain = { path = "../naome-chain" }
naome-proof = { path = "../naome-proof" }
tokio = { version = "1", default-features = false, features = ["rt", "test-util"] }

[lints]
workspace = true
