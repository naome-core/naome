[package]
name = "naome-verifier"
version.workspace = true
edition.workspace = true
description = "Fixed-validator V0 proof verifier and archive without consensus signing for NAOME."
license.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(any(unix, windows))'.dependencies]
naome-chain = { path = "../naome-chain" }
naome-consensus = { path = "../naome-consensus" }
naome-network = { path = "../naome-network" }
naome-proof = { path = "../naome-proof" }
naome-storage = { path = "../naome-storage" }
zeroize = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "signal", "sync", "time"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-permissions = "=0.2.4"
winconsole = { version = "=0.11.1", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(any(unix, windows))'.dev-dependencies]
ed25519-dalek.workspace = true
naome-foundation = { path = "../naome-foundation" }
naome-ledger = { path = "../naome-ledger" }

[lints]
workspace = true
