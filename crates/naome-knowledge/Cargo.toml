[package]
name = "naome-knowledge"
version.workspace = true
edition.workspace = true
description = "Economy-free checked proof graph replication and independent producers."
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.91"
libp2p = { version = "0.56.0", default-features = false, features = ["ed25519", "gossipsub", "macros", "noise", "request-response", "tcp", "tokio", "yamux"] }
naome-authoring = { path = "../naome-authoring" }
naome-checker = { path = "../naome-checker" }
naome-foundation = { path = "../naome-foundation" }
naome-proof = { path = "../naome-proof" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "signal", "io-std", "io-util"] }

[lints]
workspace = true
