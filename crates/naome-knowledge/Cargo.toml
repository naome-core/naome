[package]
name = "naome-knowledge"
version.workspace = true
edition.workspace = true
description = "Economy-free checked proof graph replication and independent producers."
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "naome"

[features]
# Full CI enables load and large-history regressions; MR checks stay bounded.
system-tests = []
developer-tools = ["dep:socket2"]

[[bin]]
name = "naome"
path = "src/main.rs"

[[bin]]
name = "naome-knowledge-dev"
path = "src/bin/naome-knowledge-dev.rs"
required-features = ["developer-tools"]

[dependencies]
libp2p = { version = "0.57.1", default-features = false, features = ["dcutr", "ed25519", "rsa", "ecdsa", "secp256k1", "gossipsub", "identify", "kad", "macros", "mdns", "noise", "relay", "request-response", "tcp", "tokio", "yamux"] }
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
naome-authoring = { path = "../naome-authoring" }
naome-checker = { path = "../naome-checker" }
naome-foundation = { path = "../naome-foundation" }
naome-storage = { path = "../naome-storage" }
naome-proof = { path = "../naome-proof" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { workspace = true, features = ["hooks"] }
sha2.workspace = true
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "signal", "io-util", "net", "process"] }
socket2 = { version = "=0.6.5", optional = true }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", default-features = false, features = ["process", "signal", "fs", "user", "resource", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
