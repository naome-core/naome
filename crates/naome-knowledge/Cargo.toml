[package]
name = "naome-knowledge"
version.workspace = true
edition.workspace = true
description = "Economy-free checked proof graph replication and independent producers."
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "naome"

[features]
developer-tools = []

[[bin]]
name = "naome"
path = "src/main.rs"

[[bin]]
name = "naome-knowledge-dev"
path = "src/bin/naome-knowledge-dev.rs"
required-features = ["developer-tools"]

[dependencies]
async-trait = "0.1.91"
libp2p = { version = "0.56.0", default-features = false, features = ["dcutr", "dns", "ed25519", "gossipsub", "identify", "kad", "macros", "mdns", "noise", "relay", "request-response", "tcp", "tokio", "yamux"] }
naome-authoring = { path = "../naome-authoring" }
naome-checker = { path = "../naome-checker" }
naome-foundation = { path = "../naome-foundation" }
naome-proof = { path = "../naome-proof" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "signal", "io-util", "net"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", default-features = false, features = ["process", "signal", "fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
