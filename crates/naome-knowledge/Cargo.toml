[package]
name = "naome-knowledge"
version.workspace = true
edition.workspace = true
description = "Economy-free checked proof graph replication and independent producers."
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "naome"

[features]
developer-tools = ["dep:socket2"]

[[bin]]
name = "naome"
path = "src/main.rs"

[[bin]]
name = "naome-knowledge-dev"
path = "src/bin/naome-knowledge-dev.rs"
required-features = ["developer-tools"]

[dependencies]
hmac = "=0.12.1"
hmac_sha2 = { package = "sha2", version = "=0.10.9" }
async-trait = "0.1.91"
candle-core = { version = "=0.11.0", default-features = false }
candle-nn = { version = "=0.11.0", default-features = false }
candle-transformers = { version = "=0.11.0", default-features = false }
libp2p = { version = "0.56.0", default-features = false, features = ["dcutr", "dns", "ed25519", "gossipsub", "identify", "kad", "macros", "mdns", "noise", "relay", "request-response", "tcp", "tokio", "yamux"] }
naome-authoring = { path = "../naome-authoring" }
naome-checker = { path = "../naome-checker" }
naome-foundation = { path = "../naome-foundation" }
naome-proof = { path = "../naome-proof" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2.workspace = true
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "signal", "io-util", "net", "process"] }
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"] }
socket2 = { version = "=0.6.5", optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", default-features = false, features = ["process", "signal", "fs", "user", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
