[package]
name = "naome-storage"
version.workspace = true
edition.workspace = true
description = "Anchored canonical state history and restart-safe signing custody for NAOME."
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ed25519-dalek = { workspace = true, features = ["zeroize"] }
naome-chain = { path = "../naome-chain" }
naome-consensus = { path = "../naome-consensus" }
naome-ledger = { path = "../naome-ledger" }
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
atomicwrites = "0.4.4"
winsafe = { version = "0.0.28", features = ["kernel"] }

[dev-dependencies]
naome-foundation = { path = "../naome-foundation" }
naome-proof = { path = "../naome-proof" }
naome-checker = { path = "../naome-checker" }

[lints]
workspace = true
