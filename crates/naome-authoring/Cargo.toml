[package]
name = "naome-authoring"
version.workspace = true
edition.workspace = true
description = "Prerelease source authoring for canonical NAOME proofs."
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
developer-tools = []

[[bin]]
name = "naome-author"
path = "src/bin/naome.rs"
doc = false
required-features = ["developer-tools"]

[dependencies]
naome-checker = { path = "../naome-checker" }
naome-foundation = { path = "../naome-foundation" }
naome-proof = { path = "../naome-proof" }
sha2.workspace = true

[lints]
workspace = true
