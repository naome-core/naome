name: Bazel checks

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Native build and fast tests
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Bazel
        run: bash tools/ci/install-bazel.sh

      - name: Restore Cargo downloads
        continue-on-error: true
        id: cargo-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      # Bound snapshot growth while refreshing the cache on successful main runs.
      - name: Select Bazel cache day
        id: cache-day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore local Bazel cache
        continue-on-error: true
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/naome-bazel/disk
            ~/.cache/naome-bazel/repository
          key: bazel-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock', 'Cargo.lock', '**/Cargo.toml', '**/BUILD.bazel', 'tools/bazel/**', 'rust-toolchain.toml') }}-${{ steps.cache-day.outputs.day }}
          restore-keys: |
            bazel-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock', 'Cargo.lock', '**/Cargo.toml', '**/BUILD.bazel', 'tools/bazel/**', 'rust-toolchain.toml') }}

      # The earlier snapshot used the parent directory as its cache path.
      # Only import it when no snapshot with the current paths can be restored.
      - name: Restore previous Bazel cache snapshot
        if: ${{ steps.cache.outputs.cache-matched-key == '' }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/naome-bazel
          key: bazel-legacy-import-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            bazel-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Build and lint product and test targets
        run: >-
          bazel build --config=ci
          --aspects=@rules_rust//rust:defs.bzl%rust_clippy_aspect
          --output_groups=+clippy_checks
          //:mr_build //:mr_tests //crates/... //vendor/...
          @burn_dispatch_local//... @burn_tensor_local//...
          --profile="$RUNNER_TEMP/naome-bazel-build.json.gz"

      - name: Run fast regression tests
        run: >-
          bazel test --config=ci //:mr_tests
          --profile="$RUNNER_TEMP/naome-bazel-test.json.gz"

      - name: Retain Bazel timing profiles
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-timing-${{ inputs.runner }}
          path: ${{ runner.temp }}/naome-bazel-*.json.gz
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      # Fresh crate resolution can regenerate ignored BUILD files. Detect any
      # substantive change to the checked-in definitions before accepting CI.
      - name: Verify generated Burn build definitions
        run: bash tools/ci/verify-generated-burn-builds.sh

      - name: Verify tracked sources are unchanged
        run: git diff --exit-code HEAD

      - name: Save local Bazel cache from main
        if: >-
          ${{ success() && github.event_name == 'push' &&
              github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/naome-bazel/disk
            ~/.cache/naome-bazel/repository
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Prime locked Cargo downloads from main
        if: >-
          ${{ success() && github.event_name == 'push' &&
              github.ref == 'refs/heads/main' && steps.cargo-downloads.outputs.cache-hit != 'true' }}
        id: fetch-cargo
        continue-on-error: true
        run: |
          cargo fetch --locked --target "$(rustc --version --verbose | sed -n 's/^host: //p')"

      - name: Save Cargo downloads from main
        if: ${{ success() && steps.fetch-cargo.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: ${{ steps.cargo-downloads.outputs.cache-primary-key }}
