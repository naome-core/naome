name: CI

on:
  merge_group:
    types:
      - checks_requested
    branches:
      - main
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_cargo:
        description: Also run the complete Cargo matrix
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component list --installed
          rustc --version --verbose
          cargo --version --verbose

      - name: Check CI contracts
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

      - name: Run documentation tests
        run: cargo test --workspace --doc --all-features --locked

  linux_tests:
    name: Bazel (Linux x86_64)
    uses: ./.github/workflows/bazel-tests.yml
    with:
      runner: ubuntu-24.04

  macos_tests:
    name: Bazel (macOS ARM64)
    uses: ./.github/workflows/bazel-tests.yml
    with:
      runner: macos-15

  manual_full_cargo:
    name: Manual full Cargo matrix
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_cargo }}
    uses: ./.github/workflows/full-cargo.yml

  linux:
    name: Rust platform (Linux x86_64)
    if: ${{ always() }}
    needs: linux_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify Linux Bazel checks
        env:
          PLATFORM_RESULT: ${{ needs.linux_tests.result }}
        run: |
          if [ "$PLATFORM_RESULT" != "success" ]; then
            echo "Linux Bazel result: $PLATFORM_RESULT"
            exit 1
          fi
      - name: Reject workflow cancellation
        if: ${{ always() && cancelled() }}
        run: exit 1

  macos:
    name: Rust platform (macOS ARM64)
    if: ${{ always() }}
    needs: macos_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify macOS Bazel checks
        env:
          PLATFORM_RESULT: ${{ needs.macos_tests.result }}
        run: |
          if [ "$PLATFORM_RESULT" != "success" ]; then
            echo "macOS Bazel result: $PLATFORM_RESULT"
            exit 1
          fi
      - name: Reject workflow cancellation
        if: ${{ always() && cancelled() }}
        run: exit 1

  required:
    name: Rust CI
    if: ${{ always() }}
    needs: [quality, linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out gate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci/check_results.py quality linux macos
      - name: Reject workflow cancellation
        if: ${{ always() && cancelled() }}
        run: exit 1
