name: CI

on:
  merge_group:
    types:
      - checks_requested
    branches:
      - main
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component list --installed
          rustc --version --verbose
          cargo --version --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

      - name: Run documentation tests
        run: cargo test --workspace --doc --all-features --locked

  linux_tests:
    name: Rust tests (Linux x86_64, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        profile: [test, release]
    uses: ./.github/workflows/rust-tests.yml
    with:
      runner: ubuntu-24.04
      profile: ${{ matrix.profile }}

  macos_tests:
    name: Rust tests (macOS ARM64, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        profile: [test, release]
    uses: ./.github/workflows/rust-tests.yml
    with:
      runner: macos-15
      profile: ${{ matrix.profile }}

  windows_tests:
    name: Rust tests (Windows x86_64, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        profile: [test, release]
    uses: ./.github/workflows/rust-tests.yml
    with:
      runner: windows-2025
      profile: ${{ matrix.profile }}

  linux:
    name: Rust platform (Linux x86_64)
    if: ${{ always() }}
    needs: linux_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify both Linux profiles
        env:
          PLATFORM_RESULT: ${{ needs.linux_tests.result }}
        run: |
          if [ "$PLATFORM_RESULT" != "success" ]; then
            echo "Linux profiles result: $PLATFORM_RESULT"
            exit 1
          fi
      - name: Reject workflow cancellation
        if: ${{ always() && cancelled() }}
        run: exit 1

  macos:
    name: Rust platform (macOS ARM64)
    if: ${{ always() }}
    needs: macos_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify both macOS profiles
        env:
          PLATFORM_RESULT: ${{ needs.macos_tests.result }}
        run: |
          if [ "$PLATFORM_RESULT" != "success" ]; then
            echo "macOS profiles result: $PLATFORM_RESULT"
            exit 1
          fi
      - name: Reject workflow cancellation
        if: ${{ always() && cancelled() }}
        run: exit 1

  windows:
    name: Rust platform (Windows x86_64)
    if: ${{ always() }}
    needs: windows_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify both Windows profiles
        env:
          PLATFORM_RESULT: ${{ needs.windows_tests.result }}
        run: |
          if [ "$PLATFORM_RESULT" != "success" ]; then
            echo "Windows profiles result: $PLATFORM_RESULT"
            exit 1
          fi
      - name: Reject workflow cancellation
        if: ${{ always() && cancelled() }}
        run: exit 1

  required:
    name: Rust CI
    if: ${{ always() }}
    needs: [quality, linux, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify required jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          if [ "$QUALITY_RESULT" != "success" ] || [ "$LINUX_RESULT" != "success" ] || \
             [ "$MACOS_RESULT" != "success" ] || [ "$WINDOWS_RESULT" != "success" ]; then
            echo "Required CI jobs did not all succeed."
            echo "quality=$QUALITY_RESULT linux=$LINUX_RESULT macos=$MACOS_RESULT windows=$WINDOWS_RESULT"
            exit 1
          fi
      - name: Reject workflow cancellation
        if: ${{ always() && cancelled() }}
        run: exit 1

  state_measurement:
    name: State primitive measurement (Linux x86_64)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate and compile isolated measurement prototype
        run: |
          python3 - <<'PYTHON'
          import json, subprocess, time
          manifest = 'tools/state-measurement/Cargo.toml'
          commands = [
              ['cargo', 'fmt', '--manifest-path', manifest, '--', '--check'],
              ['cargo', 'clippy', '--manifest-path', manifest, '--all-targets', '--all-features', '--locked', '--', '-D', 'warnings'],
          ]
          for profile in ['test', 'release']:
              base = ['cargo', 'test', '--manifest-path', manifest, '--profile', profile, '--all-targets', '--all-features', '--locked']
              commands.extend([base + ['--no-run'], base + ['--no-fail-fast']])
          commands.append(['cargo', 'build', '--manifest-path', manifest, '--release', '--locked'])
          for command in commands:
              start = time.monotonic()
              subprocess.run(command, check=True)
              print(json.dumps({'kind': 'preparation_step', 'command': command, 'elapsed_seconds': time.monotonic() - start}), flush=True)
          PYTHON
      - name: Measure under four-CPU and 8 GiB no-swap constraints
        run: |
          sudo systemd-run --scope --unit=naome-state-measurement \
            -p MemoryMax=8589934592 -p MemorySwapMax=0 \
            -p CPUQuota=400% -p AllowedCPUs=0-3 \
            sudo -u "$USER" env PATH="$PATH" CARGO_INCREMENTAL=0 \
            python3 "$GITHUB_WORKSPACE/tools/state-measurement/run-linux.py"
