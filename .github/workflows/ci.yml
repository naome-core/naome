name: CI

on:
  merge_group:
    types:
      - checks_requested
    branches:
      - main
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component list --installed
          rustc --version --verbose
          cargo --version --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Kev provider and local policy (offline fixtures)
        run: python3 -m unittest discover -s tools/tests -v

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

      - name: Run documentation tests
        run: cargo test --workspace --doc --all-features --locked

  linux_tests:
    name: Rust tests (Linux x86_64, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        profile: [test, release]
    uses: ./.github/workflows/rust-tests.yml
    with:
      runner: ubuntu-24.04
      profile: ${{ matrix.profile }}

  macos_tests:
    name: Rust tests (macOS ARM64, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        profile: [test, release]
    uses: ./.github/workflows/rust-tests.yml
    with:
      runner: macos-15
      profile: ${{ matrix.profile }}

  windows_tests:
    name: Rust tests (Windows x86_64, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        profile: [test, release]
    uses: ./.github/workflows/rust-tests.yml
    with:
      runner: windows-2025
      profile: ${{ matrix.profile }}

  linux:
    name: Rust platform (Linux x86_64)
    if: ${{ always() }}
    needs: linux_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify both Linux profiles
        env:
          PLATFORM_RESULT: ${{ needs.linux_tests.result }}
        run: |
          if [ "$PLATFORM_RESULT" != "success" ]; then
            echo "Linux profiles result: $PLATFORM_RESULT"
            exit 1
          fi
      - name: Reject workflow cancellation
        if: ${{ always() && cancelled() }}
        run: exit 1

  macos:
    name: Rust platform (macOS ARM64)
    if: ${{ always() }}
    needs: macos_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify both macOS profiles
        env:
          PLATFORM_RESULT: ${{ needs.macos_tests.result }}
        run: |
          if [ "$PLATFORM_RESULT" != "success" ]; then
            echo "macOS profiles result: $PLATFORM_RESULT"
            exit 1
          fi
      - name: Reject workflow cancellation
        if: ${{ always() && cancelled() }}
        run: exit 1

  windows:
    name: Rust platform (Windows x86_64)
    if: ${{ always() }}
    needs: windows_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify both Windows profiles
        env:
          PLATFORM_RESULT: ${{ needs.windows_tests.result }}
        run: |
          if [ "$PLATFORM_RESULT" != "success" ]; then
            echo "Windows profiles result: $PLATFORM_RESULT"
            exit 1
          fi
      - name: Reject workflow cancellation
        if: ${{ always() && cancelled() }}
        run: exit 1

  devnet:
    name: Devnet qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pinned toolchain and devnet tooling
        run: |
          rustup show active-toolchain
          python3 -B -m unittest discover -s devnet -p 'test_*.py'
      - name: Restore validated main release cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: cargo-v1-ubuntu-24.04-${{ runner.os }}-${{ runner.arch }}-release-all-features-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/config', '.cargo/config.toml', '.github/workflows/*.yml') }}
      - name: Build release test targets and devnet binaries
        run: cargo test -p naome-validator -p naome-verifier -p naome-cli --profile release --all-targets --all-features --locked --no-run
      - name: Qualify canonical publication, citation, outage, partition, and cold replay
        run: cargo test -p naome-validator -p naome-verifier -p naome-cli --profile release --all-targets --all-features --locked --no-fail-fast four_process_state_recovery_partition_and_independent_replay
      - name: Rehearse portable pilot bundles and independent archive collection
        run: python3 -B devnet/rehearse_pilot.py --bin-dir target/release --directory "$RUNNER_TEMP/pilot"
      - name: Package exact Linux binaries
        run: python3 -B devnet/image.py --bin-dir target/release --tag naome-devnet:ci
      - name: Qualify 100 canonical state heights with isolation, delay, and faults
        run: python3 -B devnet/qualify.py --backend docker --image naome-devnet:ci --bin-dir target/release --directory "$RUNNER_TEMP/naome-devnet" --heights 100 --timing ci-test --delay-ms 50 --deadline-seconds 2400
      - name: Verify at least twice the baseline qualification speed
        run: |
          python3 - "$RUNNER_TEMP/naome-devnet/report.json" <<'PY'
          import json, pathlib, sys
          baseline_path = pathlib.Path('docs/mvp/evidence/handoff-baseline-ci.json')
          current_path = pathlib.Path(sys.argv[1])
          baseline = json.loads(baseline_path.read_text())
          current = json.loads(current_path.read_text())
          required_faults = {
              'container_network_disconnected', 'partition_healed_on_deadline',
              'healed_and_caught_up', 'sigkill_restart', 'graceful_restart',
          }
          for report in (baseline, current):
              assert report['outcome'] == 'passed' and report['backend'] == 'docker'
              assert report['delay_ms_each_direction_per_chunk'] == 50
              assert len(report['verified']) == 4
              assert min(v['height'] for v in report['verified']) >= 100
              assert report['corrupt_export_rejected_without_repair']
              assert required_faults <= {f['operation'] for f in report['faults']}
          cut = next(f for f in current['faults'] if f['operation'] == 'container_network_disconnected')
          assert cut['active_slots_before_cut'] == 4
          assert all(f['active_signer_before_restart'] for f in current['faults']
                     if f['operation'] in ('sigkill_restart', 'graceful_restart'))
          assert current['post_restart_progress']['verified_height'] > current['post_restart_progress']['restart_height']
          speedup = baseline['elapsed_seconds'] / current['elapsed_seconds']
          def certified_windows(report):
              return [a['voting_deadline'] - a['certified_start'] for a in report['attempts']]
          current['baseline_comparison'] = {
              'baseline_commit': baseline['source_commit'],
              'baseline_ci_run': 35863331752,
              'runner': 'ubuntu-24.04',
              'baseline_seconds': baseline['elapsed_seconds'],
              'current_seconds': current['elapsed_seconds'],
              'speedup': round(speedup, 6),
              'required_speedup': 2,
              'passed': speedup >= 2,
              'includes_authorized_ci_timing_profile_change': True,
              'baseline_voting_seconds': sorted(set(certified_windows(baseline))),
              'current_voting_seconds': sorted(set(certified_windows(current))),
              'baseline_total_voting_seconds': sum(certified_windows(baseline)),
              'current_total_voting_seconds': sum(certified_windows(current)),
          }
          current_path.write_text(json.dumps(current, indent=2) + '\n')
          print(json.dumps(current['baseline_comparison'], indent=2))
          assert speedup >= 2, '100-height qualification is less than twice as fast as baseline'
          PY
      - name: Retain public qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devnet-qualification
          path: |
            ${{ runner.temp }}/naome-devnet/report.json
            ${{ runner.temp }}/pilot/rehearsal-report.json
          if-no-files-found: warn
          retention-days: 14

  required:
    name: Rust CI
    if: ${{ always() }}
    needs: [quality, linux, macos, windows, devnet]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify required jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          DEVNET_RESULT: ${{ needs.devnet.result }}
        run: |
          if [ "$QUALITY_RESULT" != "success" ] || [ "$LINUX_RESULT" != "success" ] || \
             [ "$MACOS_RESULT" != "success" ] || [ "$WINDOWS_RESULT" != "success" ] || \
             [ "$DEVNET_RESULT" != "success" ]; then
            echo "Required CI jobs did not all succeed."
            echo "quality=$QUALITY_RESULT linux=$LINUX_RESULT macos=$MACOS_RESULT windows=$WINDOWS_RESULT devnet=$DEVNET_RESULT"
            exit 1
          fi
      - name: Reject workflow cancellation
        if: ${{ always() && cancelled() }}
        run: exit 1
