name: CI

on:
  merge_group:
    types:
      - checks_requested
    branches:
      - main
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_cargo:
        description: Also run the complete Cargo matrix
        type: boolean
        default: false
      internet_acceptance:
        description: Run the explicitly requested two-host public discovery acceptance
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component list --installed
          rustc --version --verbose
          cargo --version --verbose

      - name: Check CI contracts
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install pinned dependency auditor
        run: cargo install cargo-audit --version '=0.22.2' --locked

      - name: Audit locked dependencies
        run: cargo audit --deny unsound

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

      - name: Run documentation tests
        run: cargo test --workspace --doc --all-features --locked

  linux_tests:
    name: Bazel (Linux x86_64)
    uses: ./.github/workflows/bazel-tests.yml
    with:
      runner: ubuntu-24.04

  macos_tests:
    name: Bazel (macOS ARM64)
    uses: ./.github/workflows/bazel-tests.yml
    with:
      runner: macos-15

  manual_full_cargo:
    name: Manual full Cargo matrix
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_cargo }}
    uses: ./.github/workflows/full-cargo.yml

  internet:
    name: Public discovery (${{ matrix.runner }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.internet_acceptance }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            participant: 0
          - runner: macos-15
            participant: 1
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the matching public-network test configuration
        run: cargo test -p naome-knowledge --profile test --all-targets --all-features --locked --no-run
      - name: Discover the other physical host without its identity or address
        run: >-
          python3 crates/naome-knowledge/tests/support/internet_discovery.py
          --binary target/debug/naome-knowledge-dev
          --output .local/internet --profile test --timeout 720 --hold 30
          --participant ${{ matrix.participant }}
      - name: Retain public evidence without identity keys
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: internet-${{ matrix.participant }}
          path: |
            .local/internet/summary.json
            .local/internet/*.stdout.jsonl
            .local/internet/*.stderr.jsonl
          if-no-files-found: error

  internet_result:
    name: Public discovery acceptance
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.internet_acceptance }}
    needs: internet
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: internet-*
          path: .local/internet-results
      - name: Require both hosts and authenticate counterpart payload evidence
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 tools/ci/check_results.py internet
          python3 tools/ci/check_internet.py .local/internet-results

  linux:
    name: Rust platform (Linux x86_64)
    if: ${{ always() }}
    needs: linux_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify Linux Bazel checks
        env:
          PLATFORM_RESULT: ${{ needs.linux_tests.result }}
        run: |
          if [ "$PLATFORM_RESULT" != "success" ]; then
            echo "Linux Bazel result: $PLATFORM_RESULT"
            exit 1
          fi
      - name: Reject workflow cancellation
        if: ${{ always() && cancelled() }}
        run: exit 1

  macos:
    name: Rust platform (macOS ARM64)
    if: ${{ always() }}
    needs: macos_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify macOS Bazel checks
        env:
          PLATFORM_RESULT: ${{ needs.macos_tests.result }}
        run: |
          if [ "$PLATFORM_RESULT" != "success" ]; then
            echo "macOS Bazel result: $PLATFORM_RESULT"
            exit 1
          fi
      - name: Reject workflow cancellation
        if: ${{ always() && cancelled() }}
        run: exit 1

  required:
    name: Rust CI
    if: ${{ always() }}
    needs: [quality, linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out gate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci/check_results.py quality linux macos
      - name: Reject workflow cancellation
        if: ${{ always() && cancelled() }}
        run: exit 1
