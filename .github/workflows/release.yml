name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Cargo version without v; publishes an immutable release
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release policy
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_POLICY_TOKEN: ${{ github.ref == 'refs/heads/main' && github.repository == 'naome-core/naome' && secrets.RELEASE_POLICY_TOKEN || '' }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python3 tools/release/release.py prepare --version "$REQUESTED_VERSION" --publish

  packages:
    name: Packages
    needs: prepare
    uses: ./.github/workflows/release-packages.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  qualification:
    name: Full source qualification
    needs: prepare
    uses: ./.github/workflows/full-cargo.yml

  audit:
    name: Qualify dependencies against RustSec
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject known vulnerabilities and unsound dependencies
        run: python3 tools/ci/audit_dependencies.py
      - name: Retain complete audit evidence, including rejected candidates
        id: upload
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-audit
          path: .local/release-audit/cargo-audit.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  attest:
    name: Attest verified release bytes
    needs: [packages, audit, qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.packages.outputs.artifact-id }}
          path: release
      - name: Include the exact security qualification report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.audit.outputs.artifact-id }}
          path: release
      - name: Bind security evidence to the signed download set
        run: (cd release && sha256sum cargo-audit.json >> SHA256SUMS)
      - name: Sign provenance for every downloadable payload and checksum file
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
          create-storage-record: false
      - name: Include the offline verification bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" release/provenance.sigstore.json
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attested-release
          path: release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  publish:
    name: Publish immutable release
    needs: [prepare, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.attest.outputs.artifact-id }}
          path: .local/release
      - name: Recheck qualification, verify signatures, stage and publish once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_POLICY_TOKEN: ${{ secrets.RELEASE_POLICY_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 tools/release/release.py publish --version "$RELEASE_VERSION" --directory .local/release
