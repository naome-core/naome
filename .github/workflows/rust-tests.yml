name: Rust tests

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      profile:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  NAOME_TEST_PROFILE: ${{ inputs.profile }}

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Full workspace
    runs-on: ${{ inputs.runner }}
    # Allow cold release builds plus the complete native system-test workload.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify checkout, profile, and pinned toolchain
        run: |
          case "$NAOME_TEST_PROFILE" in
            test|release) ;;
            *) echo "Unsupported test profile: $NAOME_TEST_PROFILE"; exit 1 ;;
          esac
          git show --no-patch --format='commit=%H%ntree=%T%nparents=%P' HEAD
          rustup show active-toolchain
          rustup component list --installed
          rustc --version --verbose
          cargo --version --verbose

      - name: Cache Cargo downloads
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Check with Clippy
        if: ${{ inputs.profile == 'test' }}
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build locked REP binaries
        run: cargo build --workspace --profile "$NAOME_TEST_PROFILE" --locked

      - name: Run archive, transport and process tests
        run: cargo test --workspace --profile "$NAOME_TEST_PROFILE" --all-features --all-targets --locked --no-fail-fast

      - name: Run documentation tests
        run: cargo test --workspace --doc --all-features --locked

      - name: Verify tracked sources are unchanged
        run: git diff --exit-code HEAD
