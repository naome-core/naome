name: Rust tests

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      profile:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  NAOME_TEST_PROFILE: ${{ inputs.profile }}

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Full workspace
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify checkout, profile, and pinned toolchain
        run: |
          case "$NAOME_TEST_PROFILE" in
            test|release) ;;
            *) echo "Unsupported test profile: $NAOME_TEST_PROFILE"; exit 1 ;;
          esac
          git show --no-patch --format='commit=%H%ntree=%T%nparents=%P' HEAD
          rustup show active-toolchain
          rustup component list --installed
          rustc --version --verbose
          cargo --version --verbose

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: cargo-v1-${{ inputs.runner }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-all-features-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/config', '.cargo/config.toml', '.github/workflows/*.yml') }}

      - name: Check with Clippy
        if: ${{ inputs.profile == 'test' }}
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build all test targets and process binaries
        run: cargo test --workspace --profile "$NAOME_TEST_PROFILE" --all-targets --all-features --locked --no-run

      - name: Probe hosted macOS multicast contexts
        if: ${{ runner.os == 'macOS' }}
        run: |
          NAOME_CI_PYTHON=$(python3 -c 'import sys; print(sys.executable)')
          NAOME_CI_MDNS_ROOT=0
          if "$NAOME_CI_PYTHON" devnet/mdns_ci_probe.py --output ".local/proof-network/mdns-ci-probe-$NAOME_TEST_PROFILE-ordinary.json"; then
            echo "Ordinary runner multicast probe passed"
          else
            echo "Ordinary runner multicast probe failed; retained native diagnostics"
            NAOME_CI_MDNS_ROOT=1
          fi
          sudo -n -- /usr/bin/env GITHUB_ACTIONS=true "GITHUB_RUN_ID=$GITHUB_RUN_ID" "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" "ImageOS=${ImageOS:-unknown}" "ImageVersion=${ImageVersion:-unknown}" "$NAOME_CI_PYTHON" devnet/mdns_ci_probe.py --require-root --output ".local/proof-network/mdns-ci-probe-$NAOME_TEST_PROFILE-root.json"
          echo "NAOME_MDNS_CI_ROOT=$NAOME_CI_MDNS_ROOT" >> "$GITHUB_ENV"
          echo "NAOME_MDNS_CI_PYTHON=$NAOME_CI_PYTHON" >> "$GITHUB_ENV"

      - name: Run all tests
        run: cargo test --workspace --profile "$NAOME_TEST_PROFILE" --all-targets --all-features --locked --no-fail-fast

      - name: Retain public discovery and multicast evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: discovery-${{ inputs.runner }}-${{ inputs.profile }}
          path: |
            .local/proof-network/*-ci-*.zip
            .local/proof-network/mdns-ci-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify tracked sources are unchanged
        run: git diff --exit-code HEAD

      - name: Save Cargo cache from main
        if: >-
          ${{
            success() &&
            github.event_name == 'push' &&
            github.ref == 'refs/heads/main' &&
            steps.cargo-cache.outputs.cache-hit != 'true'
          }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
