[releases."0.1.0-alpha.1"]
summary = "The first versioned alpha of the NAOME knowledge node and its wallet and ledger libraries."
features = [
  "Mathematical proof, definition and question checking and authoring, checked proof exchange, automatic peer discovery and supervised autonomous computation.",
  "Structured proof diagnostics are available through the authoring APIs and JSON output.",
  "Persistent wallet keys, a local ledger core and an internal node wallet service support network-bound signed transactions and revocable node spending. The public CLI retains automatic lifecycle, status and exact owner interests without manual resource or wallet commands.",
  "Linux x86_64 static musl and macOS ARM64 packages contain the ordinary executable, license notices, installation instructions, CycloneDX inventory, lockfile and build identity. No developer tools, trained models, private configuration or existing state are bundled.",
  "Checksums, the exact RustSec audit, source and qualification metadata, and signed GitHub Actions provenance accompany the downloads.",
]
qualification = [
  "Publication requires successful main-push CI and a fresh complete Linux/macOS Cargo matrix in both test and release profiles inside this release run, for the exact source commit. Extracted binaries also pass native lifecycle checks.",
  "The full matrix also runs nightly on standard free runners. Required fast PR checks remain mandatory.",
  "Controlled tests exercise three admitted roles and draining after capacity reduction. Native load tests report actual overlap, delivery and resumption separately from resource-limited control checks; a valid pressure pause is not evidence of work progress.",
  "These checks qualify the recorded source and downloads. They do not establish physical multi-host, public-network scale or sustained production-workload performance.",
]
data = [
  "This alpha supports current proof-catalog and configuration formats without migrations from retired formats. Stop an existing node and back up its entire data directory before replacing the executable.",
  "Use a separate NAOME_NODE_DIR for isolated trials and restore the matching backup when reverting across format changes. Installation does not start the node; there is no automatic updater.",
]
limitations = [
  "Pre-release protocols and stored formats may change; this alpha does not promise production workload readiness.",
  "The macOS executable is ad-hoc signed, without Apple Developer ID signing or notarization; browser downloads remain subject to Gatekeeper policy.",
  "Resource budgets and automatic pauses follow real host observations. A running node can have paused computation; status reports the reason while bounded network and lifecycle control remain available.",
  "The ledger validates a caller-supplied accepted transaction order and explicitly selected genesis/network identity. Network launch, issuance and reward policies, replication, consensus and finality remain separate requirements; startup creates no coin allocation.",
  "Dependency security evidence is a point-in-time whole-lockfile audit. The retained paste notice RUSTSEC-2024-0436 concerns an unmaintained package, rather than a known vulnerability or unsoundness.",
  "Trained-model quality, physical NAT traversal and Internet-scale convergence are not qualified by this release.",
]
