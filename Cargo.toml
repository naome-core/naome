[workspace]
members = [
    "crates/naome-authoring",
    "crates/naome-chain",
    "crates/naome-checker",
    "crates/naome-consensus",
    "crates/naome-devnet",
    "crates/naome-foundation",
    "crates/naome-ledger",
    "crates/naome-network",
    "crates/naome-node",
    "crates/naome-proof",
    "crates/naome-protocol",
    "crates/naome-cli",
    "crates/naome-runtime",
    "crates/naome-storage",
    "crates/naome-validator",
    "crates/naome-verifier",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/naome-core/naome"
publish = false

[workspace.dependencies]
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
num-bigint = { version = "0.4.8", default-features = false, features = ["std"] }
sha2 = { version = "0.11.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

# Optimize model exploration and repeated signature/hash checks in test builds.
# Keep debug assertions and overflow checks enabled in these packages.
[profile.test.package.naome-node]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.test.package.curve25519-dalek]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.test.package.ed25519-dalek]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.test.package.sha2]
opt-level = 2
debug-assertions = true
overflow-checks = true
