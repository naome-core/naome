[package]
name = "naome"
version.workspace = true
edition.workspace = true
description = "Protocol and Rust reference implementation for machine-verifiable mathematical proofs."
license.workspace = true
repository.workspace = true
publish.workspace = true

[workspace]
members = [
    "crates/naome-authoring",
    "crates/naome-chain",
    "crates/naome-checker",
    "crates/naome-consensus",
    "crates/naome-devnet",
    "crates/naome-economy",
    "crates/naome-foundation",
    "crates/naome-ledger",
    "crates/naome-network",
    "crates/naome-node",
    "crates/naome-proof",
    "crates/naome-protocol",
    "crates/naome-runtime",
    "crates/naome-storage",
    "crates/naome-validator",
    "crates/naome-verifier",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/naome-core/naome"
publish = false

[workspace.dependencies]
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
num-bigint = { version = "0.4.8", default-features = false, features = ["std"] }
sha2 = { version = "0.11.0", default-features = false }

[dependencies]
naome-chain = { path = "crates/naome-chain" }
naome-checker = { path = "crates/naome-checker" }
naome-consensus = { path = "crates/naome-consensus" }
naome-economy = { path = "crates/naome-economy" }
naome-proof = { path = "crates/naome-proof" }
naome-protocol = { path = "crates/naome-protocol" }

[dev-dependencies]
naome-foundation = { path = "crates/naome-foundation" }

[workspace.lints.rust]
unsafe_code = "forbid"

[lints]
workspace = true

# Optimize model exploration and repeated signature/hash checks in test builds.
# Keep debug assertions and overflow checks enabled in these packages.
[profile.test.package.naome-node]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.test.package.curve25519-dalek]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.test.package.ed25519-dalek]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.test.package.sha2]
opt-level = 2
debug-assertions = true
overflow-checks = true
