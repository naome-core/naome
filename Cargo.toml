[package]
name = "naome"
version.workspace = true
edition.workspace = true
description = "A decentralized protocol for formally verified mathematical knowledge."
license.workspace = true
repository.workspace = true
publish.workspace = true

[workspace]
members = [
    "crates/naome-chain",
    "crates/naome-checker",
    "crates/naome-foundation",
    "crates/naome-ledger",
    "crates/naome-network",
    "crates/naome-proof",
    "crates/naome-storage",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/naome-core/naome"
publish = false

[workspace.dependencies]
sha2 = { version = "0.11.0", default-features = false }

[dependencies]
naome-proof = { path = "crates/naome-proof" }
naome-storage = { path = "crates/naome-storage" }

[dev-dependencies]
naome-chain = { path = "crates/naome-chain" }
naome-foundation = { path = "crates/naome-foundation" }

[workspace.lints.rust]
unsafe_code = "forbid"

[lints]
workspace = true
