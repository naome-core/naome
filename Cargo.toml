[workspace]
members = [
    "vendor/libp2p-dcutr",
    "vendor/libp2p-relay",
    "vendor/libp2p-tcp",
    "crates/naome-authoring",
    "crates/naome-checker",
    "crates/naome-foundation",
    "crates/naome-knowledge",
    "crates/naome-proof",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/naome-core/naome"
publish = false

[workspace.dependencies]
sha2 = { version = "0.11.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

# Optimize repeated signature and hash checks in gossip test builds.
# Keep debug assertions and overflow checks enabled in these packages.
[profile.test.package.curve25519-dalek]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.test.package.ed25519-dalek]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.test.package.sha2]
opt-level = 2
debug-assertions = true
overflow-checks = true

[patch.crates-io]
libp2p-dcutr = { path = "vendor/libp2p-dcutr" }
libp2p-relay = { path = "vendor/libp2p-relay" }
libp2p-tcp = { path = "vendor/libp2p-tcp" }
